<!DOCTYPE html>

          <ul style="list-style:none;display:flex;gap:32px;margin:0;padding:0;">
            <li><a href="https://anahartlab.github.io/" style="color:#fff;text-decoration:none;font-weight:500;font-size:16px;letter-spacing:0.03em;">ГЛАВНАЯ</a></li>
            <li><a href="https://anahartlab.github.io/shop" style="color:#fff;text-decoration:none;font-weight:500;font-size:16px;letter-spacing:0.03em;">ОДЕЖДА И АКСЕССУАРЫ</a></li>

        <h1 style="text-align: center; margin-bottom: 30px;">AR-примерка полотна ALCHEMY (1.5×1 м)</h1>
        <model-viewer 
          src="images/ALCHEMY.glb"
          ios-src="images/ALCHEMY.usdz"
          alt="Флуоресцентное полотно ANAHART ALCHEMY"
          ar
          ar-modes="scene-viewer quick-look webxr"
          camera-controls
          style="width: 100%; height: 600px; background: #000;">
