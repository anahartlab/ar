<!DOCTYPE html>
<html style="font-size: 16px;" lang="ru"><head>
    <title>AR-примерка флуоресцентных полотен ANAHART</title>
    <meta name="description" content="AR-примерка флуоресцентных полотен ANAHART">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <meta name="theme-color" content="#478ac9">
  </head>
  <body data-lang="ru">
    <header class="u-clearfix u-grey-80 u-header u-header" id="header">
      <div class="u-clearfix u-sheet u-valign-middle-lg u-valign-middle-md u-valign-middle-sm u-sheet-1">
        <a href="https://anahartlab.github.io/" class="u-image u-logo u-image-1" data-image-width="1574" data-image-height="483">
          <img src="images/logoanahartclear.png" class="u-logo-image u-logo-image-1" title="Главная">
        </a>
      </div>
    </header>
    <section class="u-clearfix u-section-1" id="block-1" style="padding: 20px;">
      <div class="u-sheet u-valign-middle u-sheet-1" style="max-width: 700px; margin: 0 auto;">
        <h1 style="text-align: center; margin-bottom: 30px;">AR-примерка полотна ALCHEMY (1.5×1 м)</h1>
        <model-viewer 
          src="images/ALCHEMY.glb"
          ios-src="images/ALCHEMY.usdz"
          alt="Флуоресцентное полотно ANAHART ALCHEMY"
          ar
          ar-modes="scene-viewer quick-look webxr"
          camera-controls
          style="width: 100%; height: 600px; background: #000;">
        </model-viewer>
      </div>
    </section>
    <footer class="u-align-center u-footer u-grey-80" id="footer" style="padding: 20px; text-align: center;">
      ANAHART AR © 2025
    </footer>
  </body>
</html>
